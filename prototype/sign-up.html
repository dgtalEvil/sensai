<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — SensAI</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>

  <div class="auth-page">
    <div style="width:100%;max-width:400px;">

      <!-- Logo -->
      <a href="index.html" class="auth-logo" style="justify-content:center;margin-bottom:32px;">
        <div class="logo-icon">S</div>
        <span style="font-size:1.25rem;">SensAI</span>
      </a>

      <div class="auth-card">

        <!-- Theme toggle -->
        <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
          <button class="theme-toggle">☀️</button>
        </div>

        <div class="auth-title">Create your account</div>
        <div class="auth-sub">Start mastering DSA — free forever</div>

        <!-- Google -->
        <div class="mt-6">
          <button class="btn btn-ghost btn-full" style="gap:10px;padding:10px 16px;" onclick="window.location.href='dashboard.html'">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
        </div>

        <div class="auth-divider"><span>or sign up with email</span></div>

        <!-- Form -->
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="input" placeholder="yourhandle" />
        </div>

        <div class="form-group">
          <label class="form-label">Email address</label>
          <input type="email" class="input" placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="input" placeholder="At least 8 characters" />
        </div>

        <!-- Terms -->
        <div class="mt-4" style="display:flex;align-items:flex-start;gap:10px;">
          <input type="checkbox" id="terms" style="margin-top:2px;accent-color:var(--primary);" />
          <label for="terms" style="font-size:0.8125rem;color:var(--muted-foreground);line-height:1.5;">
            I agree to the <a href="#" style="color:var(--foreground);font-weight:500;" onclick="return false;">Terms of Service</a> and <a href="#" style="color:var(--foreground);font-weight:500;" onclick="return false;">Privacy Policy</a>
          </label>
        </div>

        <div class="mt-5">
          <button id="signup-btn" class="btn btn-primary btn-full" style="padding:11px 16px;font-size:0.9375rem;">
            Create Free Account
          </button>
        </div>

        <!-- Value props -->
        <div style="margin-top:16px;padding:12px;background:var(--muted);border-radius:var(--radius);">
          <div style="font-size:0.75rem;color:var(--muted-foreground);display:flex;flex-direction:column;gap:5px;">
            <span>✅ Free access to 60+ problems</span>
            <span>🎯 Interactive DSA visualizers</span>
            <span>📊 Progress tracking & streaks</span>
            <span>🌐 JS, Python & Java solutions</span>
          </div>
        </div>

        <div class="auth-footer">
          Already have an account? <a href="sign-in.html">Sign in</a>
        </div>

      </div>

      <!-- Back to home -->
      <div style="text-align:center;margin-top:16px;">
        <a href="index.html" style="font-size:0.8125rem;color:var(--muted-foreground);">← Back to SensAI</a>
      </div>

    </div>
  </div>

  <script src="shared.js"></script>
</body>
</html>
