<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — SensAI</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      .auth-split {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .auth-left {
        background: var(--grad-hero);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px;
        position: relative;
        overflow: hidden;
      }
      .auth-left::before {
        content: "";
        position: absolute;
        top: -80px;
        left: -80px;
        width: 320px;
        height: 320px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }
      .auth-left::after {
        content: "";
        position: absolute;
        bottom: -100px;
        right: -60px;
        width: 360px;
        height: 360px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50%;
      }
      .auth-left-content {
        position: relative;
        z-index: 1;
        text-align: center;
      }
      .auth-left-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: center;
        margin-bottom: 48px;
      }
      .auth-left-logo span {
        font-family: "Unbounded", sans-serif;
        font-size: 1.375rem;
        font-weight: 900;
        color: #fff;
      }
      .auth-left-headline {
        font-family: "Unbounded", sans-serif;
        font-size: 2rem;
        font-weight: 900;
        color: #fff;
        line-height: 1.15;
        margin-bottom: 16px;
      }
      .auth-left-sub {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1rem;
        line-height: 1.6;
        max-width: 340px;
      }

      /* Animated stats in left panel */
      .auth-stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 40px;
        width: 100%;
        max-width: 360px;
      }
      .auth-stat-box {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--radius);
        padding: 18px;
        text-align: center;
        backdrop-filter: blur(8px);
      }
      .auth-stat-box-value {
        font-family: "Unbounded", sans-serif;
        font-size: 1.75rem;
        font-weight: 900;
        color: #fff;
      }
      .auth-stat-box-label {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.8125rem;
        margin-top: 4px;
        font-weight: 500;
      }

      .auth-right {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 32px;
        background: var(--background);
        position: relative;
      }
      .auth-right::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          var(--glow-primary) 0%,
          transparent 70%
        );
        pointer-events: none;
      }
      .auth-form {
        width: 100%;
        max-width: 400px;
        position: relative;
        z-index: 1;
      }
      .auth-form-title {
        font-family: "Unbounded", sans-serif;
        font-size: 1.5rem;
        font-weight: 900;
        color: var(--foreground);
        margin-bottom: 6px;
      }
      .auth-form-sub {
        color: var(--muted-foreground);
        font-size: 0.9375rem;
        margin-bottom: 32px;
      }

      @media (max-width: 768px) {
        .auth-split {
          grid-template-columns: 1fr;
        }
        .auth-left {
          display: none;
        }
        .auth-right {
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-split">
      <!-- Left: Brand panel -->
      <div class="auth-left">
        <div class="auth-left-content">
          <div class="auth-left-logo">
            <div
              class="logo-icon"
              style="
                width: 44px;
                height: 44px;
                border-radius: 14px;
                background: rgba(255, 255, 255, 0.2);
                border: 2px solid rgba(255, 255, 255, 0.3);
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: &quot;Unbounded&quot;, sans-serif;
                font-size: 1.125rem;
                font-weight: 900;
                color: #fff;
              "
            >
              S
            </div>
            <span>SensAI</span>
          </div>
          <div class="auth-left-headline">Welcome<br />back, coder 👋</div>
          <div class="auth-left-sub">
            Pick up right where you left off. Your streak is waiting and there
            are problems left to crush.
          </div>
          <div class="auth-stat-grid">
            <div class="auth-stat-box">
              <div class="auth-stat-box-value">🔥 5</div>
              <div class="auth-stat-box-label">Day Streak</div>
            </div>
            <div class="auth-stat-box">
              <div class="auth-stat-box-value">12</div>
              <div class="auth-stat-box-label">Solved</div>
            </div>
            <div class="auth-stat-box">
              <div class="auth-stat-box-value">16%</div>
              <div class="auth-stat-box-label">Complete</div>
            </div>
            <div class="auth-stat-box">
              <div class="auth-stat-box-value">3/4</div>
              <div class="auth-stat-box-label">Daily Goal</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Form -->
      <div class="auth-right">
        <div class="auth-form">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              margin-bottom: 24px;
            "
          >
            <a
              href="index.html"
              style="
                font-size: 0.8125rem;
                color: var(--muted-foreground);
                display: flex;
                align-items: center;
                gap: 4px;
                transition: color 0.2s;
              "
              onmouseover="this.style.color = 'var(--primary)'"
              onmouseout="this.style.color = 'var(--muted-foreground)'"
              >← Back</a
            >
            <span style="color: var(--border)">·</span>
            <button class="theme-toggle" style="margin-left: auto">☀️</button>
          </div>

          <div class="auth-form-title">Sign in</div>
          <div class="auth-form-sub">Welcome back to SensAI</div>

          <!-- Google -->
          <button
            class="btn btn-ghost btn-full"
            style="gap: 10px; padding: 12px 16px; margin-bottom: 4px"
            onclick="window.location.href = 'dashboard.html'"
          >
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Continue with Google
          </button>

          <div class="auth-divider"><span>or continue with email</span></div>

          <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" class="input" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 7px;
              "
            >
              <label class="form-label" style="margin-bottom: 0"
                >Password</label
              >
              <a
                href="#"
                style="
                  font-size: 0.8125rem;
                  color: var(--primary);
                  font-weight: 600;
                "
                onclick="return false;"
                >Forgot password?</a
              >
            </div>
            <input type="password" class="input" placeholder="••••••••" />
          </div>

          <div class="mt-6">
            <button
              id="signin-btn"
              class="btn btn-primary btn-full"
              style="padding: 13px 16px; font-size: 1rem"
            >
              Sign In →
            </button>
          </div>

          <div class="auth-footer">
            Don't have an account? <a href="sign-up.html">Sign up free</a>
          </div>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
  </body>
</html>
